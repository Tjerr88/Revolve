function migrateSlotMap(map){const out={};Object.entries(map||{}).forEach(([key,value])=>{const p=key.split('|');if(p.length===4&&roles[p[1]]?.[p[2]]){const pattern=roles[p[1]][p[2]],base=p[3];out[pattern==='Upper'?`${p[0]}|${p[1]}|${p[2]}|Upper|${base}`:`${p[0]}|${p[1]}|${p[2]}|${pattern}`]=value}else if(p.length===5&&p[3]!=='Upper')out[p.slice(0,4).join('|')]=value;else out[key]=value});return out}
function load(){try{const d=defaults(),saved=JSON.parse(localStorage.getItem(KEY)||'{}'),merged={...d,...saved,counts:{...d.counts,...(saved.counts||{})},coreChoices:Array.isArray(saved.coreChoices)?saved.coreChoices:d.coreChoices,exerciseOverrides:saved.exerciseOverrides||{},loads:migrateSlotMap(saved.loads),draft:migrateSlotMap(saved.draft),pending:migrateSlotMap(saved.pending)};delete merged.finisher;delete merged.squatQ;delete merged.hingeQ;if(merged.timer?.kind==='Energy Systems')merged.timer=null;return merged}catch{return defaults()}} function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function planned(){if(state.nextType==='Resistance')return `Resistance ${state.res}`;return `${state.condIntensity?'Intervals':'Zone 2'} — ${['Run','Swim','Bike'][state.condMod]}`}

function launchConfetti(amount=75){const layer=document.querySelector('#confettiLayer');if(!layer)return;const colors=['#f6c579','#e49a43','#fff0ce','#a9652d','#d7b07a'];const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches,count=reduced?Math.min(28,amount):amount;for(let i=0;i<count;i++){const piece=document.createElement('i');piece.className='confetti-piece';piece.style.left=`${Math.random()*100}%`;piece.style.background=colors[Math.floor(Math.random()*colors.length)];piece.style.setProperty('--delay',`${Math.random()*.55}s`);piece.style.setProperty('--fall',`${2.1+Math.random()*1.7}s`);piece.style.setProperty('--drift',`${-110+Math.random()*220}px`);piece.style.setProperty('--spin',`${360+Math.random()*900}deg`);piece.style.width=`${6+Math.random()*7}px`;piece.style.height=`${8+Math.random()*12}px`;layer.appendChild(piece);setTimeout(()=>piece.remove(),4500)}}

function randomMobility(){state.mobility=Object.entries(mobility).map(([cat,arr])=>[cat,arr[Math.floor(Math.random()*arr.length)]])}
function mobilityHTML(){return `<div class="hero"><div class="eyebrow">Recovery day</div><h1>Active Mobility</h1><div class="sub">${planned()} stays next.</div></div><div class="card"><div class="session-top"><div><div class="eyebrow">Score ${scoreTotal()} / 15</div><h2>Move with curiosity</h2></div><span class="pill">Queue paused</span></div><div class="choice-row">${[10,15,20].map((m,i)=>`<button class="choice ${i===0?'on':''}" data-min="${m}">${m} min</button>`).join('')}</div><div class="mobility-list">${state.mobility.map(x=>`<div class="move"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><p class="cue">Explore, don't perform.</p><button class="quiet" id="reroll">New movements</button></div>${timerHTML('Mobility',600)}<button class="primary" id="completeMobility">Complete recovery day</button>`}
function exerciseFor(base){const pool=alternatives[base]||[base],override=state.exerciseOverrides[`${state.block}|${base}`];return override||pool[(state.block-1)%pool.length]}
function getRoleData(role,pattern){let quality,bases;if(pattern==='Upper'){quality=['Horizontal','Vertical'][state.upperDir];bases=exercises.Upper[quality][role]}else{quality=qualityMaps[(state.block-1)%3][role];bases=[exercises[pattern][quality][role]]}return{quality,items:bases.map((base,index)=>({base,index,name:exerciseFor(base)}))}}

function exerciseHTML(session,role,pattern,item){const key=exKey(session,role,pattern,item.base);let load=state.loads[key];if(load==null&&state.block>1){const old=key.replace(`${state.block}|`,`${state.block-1}|`),v=+state.loads[old];if(v)state.loads[key]=load=Math.round((v*.9)/2.5)*2.5}load=load??'';const draft=state.draft[key]||['','',''];return `<div class="exercise" data-key="${esc(key)}" data-name="${esc(item.name)}" data-pattern="${pattern}"><div class="ex-head"><div class="ex-name">${esc(item.name)}</div><div class="load"><input inputmode="decimal" data-load value="${esc(load)}" aria-label="Load for ${esc(item.name)}"><span>kg</span></div></div><div class="sets">${draft.map((v,i)=>`<label class="set">Set ${i+1}<input inputmode="numeric" data-rep="${i}" value="${esc(v)}" placeholder="reps"></label>`).join('')}</div><div class="nudges">${['--','-','+','++'].map(n=>`<button class="nudge ${state.pending[key]===n?'on':''}" data-nudge="${n}" aria-label="Load nudge ${n}">${n}</button>`).join('')}</div></div>`}
function resistanceHTML(n){const session=state.res,firstPattern=roles[session].Strength,defaultRest=firstPattern==='Upper'?90:180,defaultRestLabel=`${firstPattern} rest`,coreExercise=core[state.core][1][state.coreChoices[state.core]%core[state.core][1].length],extras=n>=11?`<details><summary>Optional: Core + Accessory</summary><div class="details-body"><div class="pair"><div class="mini"><small>${core[state.core][0]}</small><br><strong>${coreExercise}</strong></div><div class="mini"><small>Accessory</small><br><strong>${accessories[state.accessory]}</strong></div></div><p>2–3 sets of 8–15 · optionally superset</p><button class="choice ${state.extrasSelected?'on':''}" id="extrasToggle">${state.extrasSelected?'Included in session log':'Add to this session'}</button></div></details>`:'';return `<div class="hero"><div class="eyebrow">Today · Resistance</div><h1>Session ${session}</h1><div class="sub">Block ${state.block} · ${state.counts[session]} of 6 complete</div></div>${n<=10?'<div class="notice">Keep some margin · main work only.</div>':''}<div class="card">${['Strength','Hypertrophy','Endurance'].map(role=>{const pattern=roles[session][role],d=getRoleData(role,pattern),upper=pattern==='Upper';return `<div class="role" data-role-rest="${upper?90:180}" data-role-label="${role} rest"><div class="role-meta"><div><div class="eyebrow">${role}</div><h3>${d.quality} ${pattern}</h3><div class="meta">3 × ${ranges[role]}${upper?' · Push + pull superset':''}</div></div><button class="rest-chip" data-rest="${upper?90:180}" data-rest-label="${role} rest">Rest ${upper?'1:30':'3:00'}</button></div>${d.items.map(item=>exerciseHTML(session,role,pattern,item)).join('')}</div>`}).join('')}${extras}</div>${timerHTML(defaultRestLabel,defaultRest)}<button class="primary" id="complete">Complete Resistance ${session}</button>`}
function conditioningHTML(n){const interval=!!state.condIntensity,mod=['Run','Swim','Bike'][state.condMod];return `<div class="hero"><div class="eyebrow">Today · Conditioning</div><h1>${interval?'Intervals':'Zone 2'}</h1><div class="sub">${mod}</div></div>${n<=10?'<div class="notice">Keep some margin.</div>':''}<div class="card"><div class="session-top"><div><div class="eyebrow">${mod}</div><h2>${interval?'Hard, controlled':'Conversational pace'}</h2></div><span class="pill">${interval?'1:00 / 1:00':'Talk test'}</span></div>${interval?`<div class="choice-row">${[5,6,7,8,9,10].map((r,i)=>`<button class="choice ${i===0?'on':''}" data-rounds="${r}">${r} rounds</button>`).join('')}</div>`:`<div class="choice-row">${[30,35,40,45].map((m,i)=>`<button class="choice ${i===0?'on':''}" data-min="${m}">${m} min</button>`).join('')}</div>`}<p class="cue">${interval?'Maintain technical control.':'Easy aerobic work. Speak in sentences.'}</p></div>${timerHTML(interval?'Hard · Round 1 of 5':'Zone 2',interval?60:1800)}<div class="inline"><button class="quiet" id="other">Completed by other activity</button><button class="primary" id="complete">Complete session</button></div>`}
function timerHTML(label,seconds){const t=state.timer;const remaining=t?Math.max(0,Math.ceil((t.running?t.end-Date.now():t.remaining)/1000)):seconds;return `<div class="timer-card"><div class="timer-label" id="timerLabel">${t?esc(t.label):label}</div><div class="timer-time" id="timerTime">${fmt(remaining)}</div><div class="timer-actions"><button class="go" id="timerStart">${t&&t.running?'Pause':'Start'}</button><button id="timerRestart">Restart</button><button id="timerStop">Stop</button></div></div>`}
function bindMobility(){bindTimer();document.querySelector('#reroll').onclick=()=>{randomMobility();render()};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{selectChoice(b);state.selectedDuration=+b.dataset.min;setTimer(+b.dataset.min*60,'Mobility')});document.querySelector('#completeMobility').onclick=()=>completeMobility()}
function activateRest(sec,label){if(state.timer?.running)return;state.timer={remaining:sec*1000,duration:sec*1000,label,running:false};save();const l=document.querySelector('#timerLabel'),t=document.querySelector('#timerTime');if(l)l.textContent=label;if(t)t.textContent=fmt(sec)}
function bindSession(){bindTimer();document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=e=>{e.stopPropagation();setTimer(+b.dataset.rest,b.dataset.restLabel||'Rest')});document.querySelectorAll('[data-role-rest]').forEach(r=>r.addEventListener('focusin',()=>activateRest(+r.dataset.roleRest,r.dataset.roleLabel)));document.querySelectorAll('.exercise').forEach(box=>{const k=box.dataset.key;box.querySelector('[data-load]').oninput=e=>{state.loads[k]=e.target.value;save()};box.querySelectorAll('[data-rep]').forEach(i=>i.oninput=e=>{state.draft[k]=state.draft[k]||['','',''];state.draft[k][+e.target.dataset.rep]=e.target.value;save()});box.querySelectorAll('[data-nudge]').forEach(n=>n.onclick=()=>{state.pending[k]=state.pending[k]===n.dataset.nudge?null:n.dataset.nudge;render()})});const extras=document.querySelector('#extrasToggle');if(extras)extras.onclick=()=>{state.extrasSelected=!state.extrasSelected;save();extras.classList.toggle('on',state.extrasSelected);extras.textContent=state.extrasSelected?'Included in session log':'Add to this session'};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{selectChoice(b);state.selectedDuration=+b.dataset.min;setTimer(+b.dataset.min*60,'Zone 2')});document.querySelectorAll('[data-rounds]').forEach(b=>b.onclick=()=>{selectChoice(b);state.selectedDuration=+b.dataset.rounds;setPhasedTimer([{label:'Hard',ms:60000},{label:'Easy',ms:60000}],+b.dataset.rounds,'Intervals')});const c=document.querySelector('#complete');if(c)c.onclick=()=>completePlanned(false);const o=document.querySelector('#other');if(o)o.onclick=()=>completePlanned(true)}
function selectChoice(b){b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function setTimer(sec,label,extra={}){stopTick();state.timer={remaining:sec*1000,duration:sec*1000,label,running:false,...extra};render()}
function setPhasedTimer(phases,rounds,kind){stopTick();state.timer={remaining:phases[0].ms,duration:phases[0].ms,label:`${phases[0].label} · Round 1 of ${rounds}`,running:false,interval:true,phases,phaseIndex:0,round:1,rounds,kind};render()}
function bindTimer(){const s=document.querySelector('#timerStart');if(!s)return;s.onclick=()=>state.timer&&state.timer.running?pauseTimer():startTimer();document.querySelector('#timerRestart').onclick=()=>{if(state.timer){stopTick();if(state.timer.interval){state.timer.phaseIndex=0;state.timer.round=1;state.timer.duration=state.timer.phases[0].ms;state.timer.label=`${state.timer.phases[0].label} · Round 1 of ${state.timer.rounds}`}state.timer.remaining=state.timer.duration;state.timer.running=false;render()}};document.querySelector('#timerStop').onclick=()=>{stopTick();state.timer=null;render()};if(state.timer?.running)startTick()}
async function startTimer(){if(!state.timer){const shown=document.querySelector('#timerTime').textContent.split(':'),ms=((+shown[0])*60+(+shown[1]))*1000;state.timer={remaining:ms,duration:ms,label:document.querySelector('#timerLabel').textContent,running:false}}state.timer.end=Date.now()+state.timer.remaining;state.timer.running=true;try{wake=await navigator.wakeLock?.request('screen')}catch{}save();startTick();render()}
function pauseTimer(){state.timer.remaining=Math.max(0,state.timer.end-Date.now());state.timer.running=false;stopTick();save();render()} function stopTick(){clearInterval(tick);tick=null;try{wake?.release()}catch{}wake=null}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!state.timer?.running)return;let left=state.timer.end-Date.now();if(left<=0){timerDone();return}const e=document.querySelector('#timerTime');if(e)e.textContent=fmt(Math.ceil(left/1000))},250)}
function timerDone(){beep();if(state.timer.interval){const t=state.timer;if(t.phaseIndex===t.phases.length-1){if(t.round>=t.rounds){stopTick();t.running=false;t.remaining=0;t.label=`${t.kind} complete`;save();render();return}t.round++;t.phaseIndex=0}else t.phaseIndex++;const phase=t.phases[t.phaseIndex];t.label=`${phase.label} · Round ${t.round} of ${t.rounds}`;t.duration=phase.ms;t.remaining=phase.ms;t.end=Date.now()+phase.ms;save();render()}else{stopTick();state.timer.running=false;state.timer.remaining=0;save();render()}}
function beep(){if(state.sound)try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.08;o.frequency.value=620;o.start();o.stop(c.currentTime+.18)}catch{}navigator.vibrate?.([100,60,100])} function fmt(s){s=Math.max(0,s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function snapshot(type,other=false,details=null){return{date:new Date().toISOString(),type,other,block:state.block,score:scoreTotal(),details}}
function resistanceSnapshot(){const session=state.res,items=[];['Strength','Hypertrophy','Endurance'].forEach(role=>{const pattern=roles[session][role],d=getRoleData(role,pattern);d.items.forEach(item=>{const key=exKey(session,role,pattern,item.base);items.push({role,pattern,quality:d.quality,name:item.name,range:ranges[role],load:state.loads[key]??'',reps:[...(state.draft[key]||['','',''])],nudge:state.pending[key]||null})})});const coreExercise=core[state.core][1][state.coreChoices[state.core]%core[state.core][1].length],extrasDone=scoreTotal()>=11&&state.extrasSelected;return{session,exercises:items,extrasDone,core:extrasDone?`${core[state.core][0]} · ${coreExercise}`:null,accessory:extrasDone?accessories[state.accessory]:null}}
function conditioningSnapshot(other){return{modality:['Run','Swim','Bike'][state.condMod],intensity:state.condIntensity?'Intervals':'Zone 2',duration:state.selectedDuration||(state.condIntensity?5:30),other}}
function completeMobility(){state.history.unshift(snapshot('Active Mobility',false,{duration:state.selectedDuration||10,movements:state.mobility.map(x=>({category:x[0],name:x[1]}))}));state.gate=null;state.mobility=null;state.timer=null;state.selectedDuration=null;state.extrasSelected=false;closeTrainingDay('Active Mobility')}

function advanceResistance(extrasDone=false){applyNudges();state.counts[state.res]++;state.res={A:'B',B:'C',C:'A'}[state.res];state.upperDir=1-state.upperDir;if(extrasDone){const completedCore=state.core;state.coreChoices[completedCore]++;state.core=(state.core+1)%5;state.accessory=(state.accessory+1)%4}state.nextType='Conditioning';if(state.counts.A>=6&&state.counts.B>=6&&state.counts.C>=6)state.blockReady=true}

function renderHistory(){const el=document.querySelector('#history'),total=state.counts.A+state.counts.B+state.counts.C;el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Training record</div><h2>History</h2></div><span class="pill">Block ${state.block}</span></div><div class="card flat"><div class="eyebrow">Exercise block progress</div><div class="progress">${['A','B','C'].map(k=>`<div class="prog"><strong>${k}</strong><div>${state.counts[k]} / 6</div><div class="bar"><i style="width:${state.counts[k]/6*100}%"></i></div></div>`).join('')}</div><div class="sub">${total} / 18 Resistance sessions</div></div><div class="card">${state.history.length?state.history.map(h=>`<div class="history-item"><div class="history-row"><div><strong>${esc(h.type)}</strong><br><small>${new Date(h.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · Block ${h.block||1}</small></div><small>${h.score?`Recovery ${h.score}/15`:''}</small></div>${historyDetails(h)}</div>`).join(''):'<div class="empty">Your completed sessions will appear here.</div>'}</div>`}
function exerciseSettingsHTML(){return `<details><summary>Exercise Block ${state.block} · Exercise choices</summary><div class="details-body"><p>Each new block advances to the next variant. You can replace any slot for this block.</p>${Object.entries(alternatives).map(([base,pool])=>{const current=exerciseFor(base);return `<div class="setting"><label>${esc(base)}</label><select class="select exercise-select" data-base="${esc(base)}">${pool.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}).join('')}</div></details>`}
function renderSettings(){const el=document.querySelector('#settings');el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Keep it simple</div><h2>Settings</h2></div></div><div class="card"><div class="setting"><label>Next session</label><p>${planned()}</p></div>${exerciseSettingsHTML()}<div class="setting"><label>Manual history entry</label><p>Only the session that is currently next can advance the queue. Active Mobility never advances it.</p><div class="manual-grid"><select class="select" id="manualType"><option>Resistance A</option><option>Resistance B</option><option>Resistance C</option><option>Zone 2</option><option>Intervals</option><option>Active Mobility</option><option>Other activity replacing conditioning</option></select><button class="secondary" id="manualAdd">Add entry</button></div></div><div class="setting"><label>Sound & vibration</label><button class="quiet" id="sound">${state.sound?'On':'Off'}</button></div><div class="setting"><label>Export data</label><button class="quiet" id="export">Download backup</button></div><div class="setting" style="border:0"><label>Reset</label><p>Erase all Revolve data on this device.</p><button class="danger" id="reset">Reset app</button></div></div>`;el.querySelectorAll('.exercise-select').forEach(s=>s.onchange=()=>{state.exerciseOverrides[`${state.block}|${s.dataset.base}`]=s.value;save();toast('Exercise updated for this block.');renderToday()});el.querySelector('#sound').onclick=()=>{state.sound=!state.sound;render()};el.querySelector('#manualAdd').onclick=manualAdd;el.querySelector('#export').onclick=exportData;el.querySelector('#reset').onclick=()=>{if(confirm('Erase all Revolve data?')){localStorage.removeItem(KEY);state=defaults();render()}}}
function manualAdd(){const t=document.querySelector('#manualType').value;if(t==='Active Mobility'){state.history.unshift(snapshot(t,false,{manual:true}));toast('Recovery entry added. Queue unchanged.');render();return}if(state.blockReady&&t.startsWith('Resistance')){toast('Start the next exercise block first.');return}if(t.startsWith('Resistance')){const s=t.slice(-1);if(state.nextType!=='Resistance'||s!==state.res){toast(`${t} is not next. Queue unchanged.`);return}state.history.unshift(snapshot(t,false,{manual:true,session:s}));advanceResistance()}else{if(state.nextType!=='Conditioning'){toast('Conditioning is not next. Queue unchanged.');return}const expected=state.condIntensity?'Intervals':'Zone 2';if(t!==expected&&!t.startsWith('Other')){toast(`${expected} is next. Queue unchanged.`);return}state.history.unshift(snapshot(t,t.startsWith('Other'),{...conditioningSnapshot(t.startsWith('Other')),manual:true}));advanceConditioning()}state.gate=null;state.timer=null;state.selectedDuration=null;toast('Planned session restored and queue advanced.');render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`revolve-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));window.scrollTo({top:0,behavior:'smooth'});if(b.dataset.view==='history')renderHistory();if(b.dataset.view==='settings')renderSettings()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(state.completedDay&&state.completedDay!==localDayKey())render()},60000);render();
</script>
<script>
let deferredInstallPrompt=null;
const installButton=document.querySelector('#installApp');
const connectionStatus=document.querySelector('#connectionStatus');
const installDialog=document.querySelector('#installDialog');
const installInstructions=document.querySelector('#installInstructions');

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function syncInstallButton(){
  if(isStandalone())localStorage.setItem('revolve-pwa-installed','1');
  installButton.hidden=isStandalone()||localStorage.getItem('revolve-pwa-installed')==='1';
}

function updateConnectionStatus(){
  connectionStatus.textContent=navigator.onLine?'Train the pattern · rotate the stimulus':'Offline · training data stays available';
}

window.addEventListener('online',updateConnectionStatus);
window.addEventListener('offline',updateConnectionStatus);
updateConnectionStatus();

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
});

installButton.addEventListener('click',async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted')localStorage.setItem('revolve-pwa-installed','1');
    deferredInstallPrompt=null;
    syncInstallButton();
    return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  installInstructions.innerHTML=ios
    ?'<p>Safari manages installation on iPhone and iPad:</p><ol><li>Tap <strong>Share</strong> at the bottom.</li><li>Choose <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>'
    :'<p>Use your browser installation option:</p><ol><li>Open the browser menu <strong>⋮</strong>.</li><li>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li><li>Confirm the installation.</li></ol>';
  if(typeof installDialog.showModal==='function')installDialog.showModal();
  else alert(installInstructions.textContent);
});

document.querySelector('#closeInstallDialog').addEventListener('click',()=>installDialog.close());

window.addEventListener('appinstalled',()=>{
  localStorage.setItem('revolve-pwa-installed','1');
  deferredInstallPrompt=null;
  syncInstallButton();
});

window.matchMedia('(display-mode: standalone)').addEventListener?.('change',syncInstallButton);
syncInstallButton();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>
