function bindSwimIntervals(){const rounds=Number(state.selectedDuration)||recommendedIntervalRounds(),length=document.querySelector('#swimLength'),rest=document.querySelector('#swimRest'),skip=document.querySelector('#swimSkipRest');if(length)length.onclick=()=>{stopTick();state.timer=null;state.swimRoundsDone=Math.min(rounds,(Number(state.swimRoundsDone)||0)+1);state.swimAwaitingRest=state.swimRoundsDone<rounds;save();render()};if(rest)rest.onclick=()=>{state.swimAwaitingRest=false;save();setTimer(60,'Swim recovery')};if(skip)skip.onclick=()=>{stopTick();state.timer=null;state.swimAwaitingRest=false;save();render()}}
function bindSession(){const swimInterval=state.nextType==='Conditioning'&&!!state.condIntensity&&Number(state.condMod)===1,initialRounds=document.querySelector('[data-rounds].on');if(initialRounds&&!state.timer&&!swimInterval){const rounds=+initialRounds.dataset.rounds;state.selectedDuration=rounds;state.timer=phasedTimer([{label:'Hard',ms:60000},{label:'Recovery',ms:60000}],rounds,'Intervals');save()}bindTimer();document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=e=>{e.stopPropagation();setTimer(+b.dataset.rest,b.dataset.restLabel||'Rest')});document.querySelectorAll('[data-role-rest]').forEach(r=>r.addEventListener('focusin',()=>activateRest(+r.dataset.roleRest,r.dataset.roleLabel)));document.querySelectorAll('.exercise').forEach(box=>{const k=box.dataset.key;box.querySelector('[data-load]').oninput=e=>{state.loads[k]=e.target.value;save()};box.querySelectorAll('[data-rep]').forEach(i=>i.oninput=e=>{state.draft[k]=state.draft[k]||['','',''];state.draft[k][+e.target.dataset.rep]=e.target.value;save()});box.querySelectorAll('[data-nudge]').forEach(n=>n.onclick=()=>{state.pending[k]=state.pending[k]===n.dataset.nudge?null:n.dataset.nudge;render()})});const extras=document.querySelector('#extrasToggle');if(extras)extras.onclick=()=>{state.extrasSelected=!state.extrasSelected;save();extras.classList.toggle('on',state.extrasSelected);extras.textContent=state.extrasSelected?'Included in session log':'Add to this session'};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{selectChoice(b);state.selectedDuration=+b.dataset.min;setTimer(+b.dataset.min*60,'Zone 2')});document.querySelectorAll('[data-rounds]').forEach(b=>b.onclick=()=>{selectChoice(b);state.selectedDuration=+b.dataset.rounds;if(swimInterval){stopTick();state.timer=null;state.swimRoundsDone=0;state.swimAwaitingRest=false;save();render()}else setPhasedTimer([{label:'Hard',ms:60000},{label:'Recovery',ms:60000}],+b.dataset.rounds,'Intervals')});bindSwimIntervals();const c=document.querySelector('#complete');if(c)c.onclick=()=>completePlanned(false);const o=document.querySelector('#other');if(o)o.onclick=()=>completePlanned(true)}
function selectChoice(b){b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function simpleTimer(sec,label,extra={}){return{total:sec*1000,elapsed:0,startedAt:null,label,running:false,interval:false,lastSignalSegment:-1,pendingCue:null,...extra}}
function setTimer(sec,label,extra={}){stopTick();state.timer=simpleTimer(sec,label,extra);render()}
function phasedTimer(phases,rounds,kind){return{total:phases.reduce((n,p)=>n+p.ms,0)*rounds,elapsed:0,startedAt:null,label:`${phases[0].label} · Round 1 of ${rounds}`,running:false,interval:true,phases,rounds,kind,lastSignalSegment:-1,pendingCue:null}}
function timerElapsed(t,now=Date.now()){return Math.max(0,Number(t.elapsed)||0)+(t.running&&t.startedAt?Math.max(0,now-t.startedAt):0)}
function timerPosition(t,now=Date.now()){const elapsed=timerElapsed(t,now);if(elapsed>=t.total)return{complete:true,remaining:0,label:`${t.kind||t.label} complete`,elapsed:t.total,segment:t.interval?t.rounds*t.phases.length:-1};if(!t.interval)return{complete:false,remaining:t.total-elapsed,label:t.label,elapsed,segment:-1};const perRound=t.phases.reduce((n,p)=>n+p.ms,0),round=Math.floor(elapsed/perRound)+1,within=elapsed%perRound;let phaseIndex=0,offset=0;for(let i=0;i<t.phases.length;i++){if(within<offset+t.phases[i].ms){phaseIndex=i;break}offset+=t.phases[i].ms}const phase=t.phases[phaseIndex];return{complete:false,remaining:offset+phase.ms-within,label:`${phase.label} · Round ${round} of ${t.rounds}`,elapsed,round,phaseIndex,phase,segment:(round-1)*t.phases.length+phaseIndex}}
function setPhasedTimer(phases,rounds,kind){stopTick();state.timer=phasedTimer(phases,rounds,kind);render()}
function bindTimer(){const s=document.querySelector('#timerStart');if(!s)return;s.onclick=()=>state.timer&&state.timer.running?pauseTimer():startTimer();document.querySelector('#timerRestart').onclick=()=>{if(state.timer){stopTick();state.timer.elapsed=0;state.timer.startedAt=null;state.timer.running=false;state.timer.pendingCue=null;state.timer.lastSignalSegment=-1;save();render()}};document.querySelector('#timerStop').onclick=()=>{stopTick();state.timer=null;save();render()};if(state.timer?.running)startTick()}
async function startTimer(){if(!state.timer){const shown=document.querySelector('#timerTime').textContent.split(':'),sec=(+shown[0])*60+(+shown[1]);state.timer=simpleTimer(sec,document.querySelector('#timerLabel').textContent)}if(timerPosition(state.timer).complete){state.timer.elapsed=0;state.timer.lastSignalSegment=-1}getAudioContext();state.timer.startedAt=Date.now();state.timer.running=true;state.timer.pendingCue=null;if(state.timer.interval&&state.timer.elapsed===0){playCue('hard');state.timer.lastSignalSegment=0}save();startTick();render()}
function pauseTimer(){const t=state.timer;if(!t)return;t.elapsed=timerElapsed(t);t.startedAt=null;t.running=false;t.pendingCue=null;stopTick();save();render()}
function stopTick(){clearInterval(tick);tick=null;releaseWakeLock()}
function startTick(){clearInterval(tick);tick=setInterval(()=>syncTimer(!document.hidden),250);requestWakeLock();syncTimer(!document.hidden)}
function syncTimer(allowSound=true){const t=state.timer;if(!t?.running)return;const p=timerPosition(t),label=document.querySelector('#timerLabel'),time=document.querySelector('#timerTime');if(label)label.textContent=p.label;if(time)time.textContent=fmt(Math.ceil(p.remaining/1000));if(p.complete){t.elapsed=t.total;t.startedAt=null;t.running=false;const cue=t.kind==='Rest'?'rest':'complete';if(allowSound)playCue(cue);else t.pendingCue=cue;stopTick();save();render();return}if(t.interval&&p.segment!==t.lastSignalSegment){const cue=p.phaseIndex===0?'hard':'easy';if(allowSound)playCue(cue);else t.pendingCue=cue;t.lastSignalSegment=p.segment;save()}}
function getAudioContext(){if(audioCtx)return audioCtx;try{const C=window.AudioContext||window.webkitAudioContext;audioCtx=C?new C():null}catch{}return audioCtx}
function playCue(type){if(!state.sound)return;const c=getAudioContext();if(!c)return;try{if(c.state==='suspended')c.resume();const patterns={hard:[[880,0,.1],[880,.18,.1]],easy:[[440,0,.35]],rest:[[660,0,.12],[660,.2,.12]],complete:[[520,0,.1],[680,.16,.1],[840,.32,.18]]},start=c.currentTime+.02;(patterns[type]||patterns.rest).forEach(([hz,delay,duration])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=hz;g.gain.setValueAtTime(.0001,start+delay);g.gain.exponentialRampToValueAtTime(.12,start+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,start+delay+duration);o.start(start+delay);o.stop(start+delay+duration+.02)})}catch{}}
async function requestWakeLock(){if(!state.timer?.running||document.hidden||wake)return;try{window.RevolveAndroid?.setTimerRunning(true);wake=await navigator.wakeLock?.request('screen');wake?.addEventListener('release',()=>{wake=null},{once:true})}catch{wake=null}}

function playPendingCue(){const cue=state.timer?.pendingCue;if(!cue)return;state.timer.pendingCue=null;playCue(cue);save()}
function fmt(s){s=Math.max(0,s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function snapshot(type,other=false,details=null){return{date:new Date().toISOString(),type,other,block:state.block,score:scoreTotal(),details}}
function resistanceSnapshot(){const session=state.res,items=[];['Strength','Hypertrophy','Endurance'].forEach(role=>{const pattern=roles[session][role],d=getRoleData(role,pattern);d.items.forEach(item=>{const key=exKey(session,role,pattern,item.base);items.push({role,pattern,quality:d.quality,name:item.name,range:ranges[role],load:state.loads[key]??'',reps:[...(state.draft[key]||['','',''])],nudge:state.pending[key]||null})})});const coreExercise=core[state.core][1][state.coreChoices[state.core]%core[state.core][1].length],extrasDone=scoreTotal()>=11&&state.extrasSelected;return{session,exercises:items,extrasDone,core:extrasDone?`${core[state.core][0]} · ${coreExercise}`:null,accessory:extrasDone?accessories[state.accessory]:null}}
function conditioningSnapshot(other){const interval=!!state.condIntensity,modality=['Run','Swim','Bike'][state.condMod];return{modality,intensity:interval?'Intervals':'Zone 2',duration:state.selectedDuration||(interval?recommendedIntervalRounds():30),warmup:interval?5:null,cooldown:interval?5:null,protocol:interval&&modality==='Swim'?'Pool lengths + optional 1:00 rest':interval?'1:00 hard / 1:00 recovery':null,other}}
function completeMobility(){const guard=state.mobilityCause==='guard'||recoveryGuardDue(),label=guard?'Recovery Guard':'Active Mobility';state.history.unshift(snapshot(label,false,{duration:state.selectedDuration||10,movements:state.mobility.map(x=>({category:x[0],name:x[1]}))}));state.gate=null;state.mobility=null;state.mobilityCause=null;state.timer=null;state.selectedDuration=null;state.extrasSelected=false;closeTrainingDay(label)}

function advanceResistance(extrasDone=false){applyNudges();state.counts[state.res]++;state.res={A:'B',B:'C',C:'A'}[state.res];state.upperDir=1-state.upperDir;if(extrasDone){const completedCore=state.core;state.coreChoices[completedCore]++;state.core=(state.core+1)%5;state.accessory=(state.accessory+1)%4}state.nextType='Conditioning';if(state.counts.A>=6&&state.counts.B>=6&&state.counts.C>=6)state.blockReady=true}
function advanceConditioning(){if(state.condIntensity)state.intervalProgress=Math.min(3,(Number(state.intervalProgress)||0)+1);const cycle=conditioningCycle(),current=cycle.findIndex(x=>x.intensity===Number(state.condIntensity)&&x.mod===Number(state.condMod)),next=cycle[(current<0?0:current+1)%cycle.length];state.condIntensity=next.intensity;state.condMod=next.mod;state.nextType='Resistance'}

function startNextBlock(){state.block++;state.counts={A:0,B:0,C:0};state.intervalProgress=0;state.blockReady=false}
function historyDetails(h){const d=h.details;if(!d)return'';if(Array.isArray(d.exercises))return `<details><summary>Session details</summary><div class="history-detail">${d.exercises.map(x=>`<div class="history-ex"><div><strong>${esc(x.name)}</strong><br><small>${x.role} · ${x.quality} ${x.pattern} · ${x.range}</small></div><div style="text-align:right">${x.load!==''?`${esc(x.load)} kg`:''}<br><small>${x.reps.filter(Boolean).length?x.reps.map(r=>r||'—').join(' / '):'No reps'}${x.nudge?` · ${x.nudge}`:''}</small></div></div>`).join('')}${d.extrasDone?`<p><small>Optional · ${esc(d.core)} · ${esc(d.accessory)}</small></p>`:''}</div></details>`;if(Array.isArray(d.movements))return `<details><summary>Movements · ${d.duration} min</summary><div class="history-detail">${d.movements.map(x=>`<div><small>${esc(x.category)}</small><br>${esc(x.name)}</div>`).join('<br>')}</div></details>`;return `<div class="history-detail">${d.intensity?`${esc(d.intensity)} · ${esc(d.modality)}`:''}${d.duration?` · ${d.duration}${d.intensity==='Intervals'?' rounds':' min'}`:''}${d.other?' · Replaced by other activity':''}${d.manual?' · Manual entry':''}</div>`}
function renderHistory(){const el=document.querySelector('#history'),total=state.counts.A+state.counts.B+state.counts.C;el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Training record</div><h2>History</h2></div><span class="pill">Block ${state.block}</span></div><div class="card flat"><div class="eyebrow">Exercise block progress</div><div class="progress">${['A','B','C'].map(k=>`<div class="prog"><strong>${k}</strong><div>${state.counts[k]} / 6</div><div class="bar"><i style="width:${state.counts[k]/6*100}%"></i></div></div>`).join('')}</div><div class="sub">${total} / 18 Resistance sessions</div></div><div class="card">${state.history.length?state.history.map(h=>`<div class="history-item"><div class="history-row"><div><strong>${esc(h.type)}</strong><br><small>${new Date(h.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · Block ${h.block||1}</small></div><small>${h.score?`Recovery ${h.score}/15`:''}</small></div>${historyDetails(h)}</div>`).join(''):'<div class="empty">Your completed sessions will appear here.</div>'}</div>`}
function renderSettings(){const el=document.querySelector('#settings');el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Keep it simple</div><h2>Settings</h2></div></div><div class="card"><div class="setting"><label>Next session</label><p>${planned()}</p></div><div class="setting"><label>Training reminder</label><p>Notify me when no session has been logged today. Delivery can be slightly delayed by Android battery saving.</p><div class="inline"><input class="select" type="time" id="reminderTime" value="${esc(state.reminderTime||'18:00')}" aria-label="Reminder time"><button class="secondary" id="reminderToggle">${state.reminderEnabled?'On':'Off'}</button></div></div><div class="setting"><label>Recovery rhythm</label><p>After six consecutive logged days, the next day is Full Rest. Any earlier empty day resets the streak.</p></div><div class="setting"><label>Conditioning activities</label><p>Every selected activity receives both Zone 2 and Intervals. Keep at least one active.</p>${activityChoicesHTML('settings-activity')}</div><div class="setting"><label>How Revolve works</label><p>Review the purpose, session queue and Recovery Guard.</p><button class="quiet" id="showIntroduction">Show introduction</button></div><div class="setting"><label>Manual history entry</label><p>Only the session that is currently next can advance the queue. Active Mobility never advances it.</p><div class="manual-grid"><select class="select" id="manualType"><option>Resistance A</option><option>Resistance B</option><option>Resistance C</option><option>Zone 2</option><option>Intervals</option><option>Active Mobility</option><option>Other activity replacing conditioning</option></select><button class="secondary" id="manualAdd">Add entry</button></div></div><div class="setting"><label>Sound</label><button class="quiet" id="sound">${state.sound?'On':'Off'}</button></div><div class="setting"><label>Export data</label><button class="quiet" id="export">Download backup</button></div><div class="setting" style="border:0"><label>Reset</label><p>Erase all Revolve data on this device and show setup again.</p><button class="danger" id="reset">Reset app</button></div></div>`;el.querySelectorAll('[data-settings-activity]').forEach(b=>b.onclick=()=>{if(setCardioActivity(+b.dataset.settingsActivity))render()});el.querySelector('#reminderTime').onchange=e=>{state.reminderTime=e.target.value||'18:00';save();syncAndroidReminder(false)};el.querySelector('#reminderToggle').onclick=()=>{state.reminderEnabled=!state.reminderEnabled;save();syncAndroidReminder(state.reminderEnabled);if(state.reminderEnabled)toast('Allow notifications when Android asks.');render()};el.querySelector('#showIntroduction').onclick=()=>{state.onboardingComplete=false;save();document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view==='today'));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='today'));renderToday();window.scrollTo({top:0,behavior:'smooth'})};el.querySelector('#sound').onclick=()=>{state.sound=!state.sound;render()};el.querySelector('#manualAdd').onclick=manualAdd;el.querySelector('#export').onclick=exportData;const reset=el.querySelector('#reset');reset.onclick=()=>{if(reset.dataset.confirm!=='yes'){reset.dataset.confirm='yes';reset.textContent='Tap again to erase everything';toast('Tap Reset again to confirm.');return}localStorage.removeItem(KEY);state=defaults();syncAndroidReminder(false);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view==='today'));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='today'));render()}}
function manualAdd(){if(fullRestDue()){toast('Full Rest Day keeps the queue paused.');return}const t=document.querySelector('#manualType').value;if(t==='Active Mobility'){state.history.unshift(snapshot(t,false,{manual:true}));toast('Recovery entry added. Queue unchanged.');render();return}if(state.blockReady&&t.startsWith('Resistance')){toast('Start the next exercise block first.');return}if(t.startsWith('Resistance')){const s=t.slice(-1);if(state.nextType!=='Resistance'||s!==state.res){toast(`${t} is not next. Queue unchanged.`);return}state.history.unshift(snapshot(t,false,{manual:true,session:s}));advanceResistance()}else{if(state.nextType!=='Conditioning'){toast('Conditioning is not next. Queue unchanged.');return}const expected=state.condIntensity?'Intervals':'Zone 2';if(t!==expected&&!t.startsWith('Other')){toast(`${expected} is next. Queue unchanged.`);return}state.history.unshift(snapshot(t,t.startsWith('Other'),{...conditioningSnapshot(t.startsWith('Other')),manual:true}));advanceConditioning()}state.gate=null;state.timer=null;state.selectedDuration=null;toast('Planned session restored and queue advanced.');render()}

document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));window.scrollTo({top:0,behavior:'smooth'});if(b.dataset.view==='history')renderHistory();if(b.dataset.view==='settings')renderSettings()});

<script>
let deferredInstallPrompt=null;
const installButton=document.querySelector('#installApp');
const connectionStatus=document.querySelector('#connectionStatus');
const installDialog=document.querySelector('#installDialog');
const installInstructions=document.querySelector('#installInstructions');

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function syncInstallButton(){
  if(window.RevolveAndroid){installButton.hidden=true;return}
  if(isStandalone())localStorage.setItem('revolve-pwa-installed','1');
  installButton.hidden=isStandalone()||localStorage.getItem('revolve-pwa-installed')==='1';
}

function updateConnectionStatus(){
  if(window.RevolveAndroid){connectionStatus.textContent='Android app · offline ready';return}
  connectionStatus.textContent=navigator.onLine?'Train the pattern · rotate the stimulus':'Offline · training data stays available';
}

window.addEventListener('online',updateConnectionStatus);
window.addEventListener('offline',updateConnectionStatus);
updateConnectionStatus();

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
});

installButton.addEventListener('click',async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted')localStorage.setItem('revolve-pwa-installed','1');
    deferredInstallPrompt=null;
    syncInstallButton();
    return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  installInstructions.innerHTML=ios
    ?'<p>Safari manages installation on iPhone and iPad:</p><ol><li>Tap <strong>Share</strong> at the bottom.</li><li>Choose <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>'
    :'<p>Use your browser installation option:</p><ol><li>Open the browser menu <strong>⋮</strong>.</li><li>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li><li>Confirm the installation.</li></ol>';
  if(typeof installDialog.showModal==='function')installDialog.showModal();
  else alert(installInstructions.textContent);
});

document.querySelector('#closeInstallDialog').addEventListener('click',()=>installDialog.close());

window.addEventListener('appinstalled',()=>{
  localStorage.setItem('revolve-pwa-installed','1');
  deferredInstallPrompt=null;
  syncInstallButton();
});

window.matchMedia('(display-mode: standalone)').addEventListener?.('change',syncInstallButton);
syncInstallButton();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
}
</script>
