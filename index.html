function renderSettings(){const el=document.querySelector('#settings'),conditioningOptions=state.conditioningEnabled?'':'off';el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Keep it simple</div><h2>Settings</h2></div></div><div class="card"><div class="setting"><label>Next session</label><p>${planned()}${state.activeSession?' · session in progress':''}</p></div><div class="setting"><label>Training reminder</label><p>Notify me when no session has been logged today. Delivery can be slightly delayed by Android battery saving.</p><div class="inline"><input class="select" type="time" id="reminderTime" value="${esc(state.reminderTime||'18:00')}" aria-label="Reminder time"><button class="secondary" id="reminderToggle">${state.reminderEnabled?'On':'Off'}</button></div></div><div class="setting"><label>Recovery rhythm</label><p>After six consecutive logged days, the next day is Full Rest. Any earlier empty day resets the streak.</p></div><div class="setting"><label class="setting-check"><input type="checkbox" id="conditioningEnabled" ${state.conditioningEnabled?'checked':''}><span><strong>Conditioning activities</strong><small>Include Zone 2 and Intervals in Revolve. Turn this off when conditioning is handled outside the app; Resistance A/B/C will then continue without conditioning slots.</small></span></label><div class="conditioning-options ${conditioningOptions}" aria-disabled="${!state.conditioningEnabled}">${activityChoicesHTML('settings-activity')}</div></div>${hiftSettingsHTML()}<div class="setting"><label>How Revolve works</label><p>Review the purpose, session queue and Recovery Guard.</p><button class="quiet" id="showIntroduction">Show introduction</button></div><div class="setting"><label>Manual history entry</label><p>Only the session that is currently next can advance the queue. Active Mobility never advances it.</p><div class="manual-grid"><select class="select" id="manualType"><option>Resistance A</option><option>Resistance B</option><option>R me=e.target.value||'18:00';save();syncAndroidReminder(false)};el.querySelector('#reminderToggle').onclick=()=>{state.reminderEnabled=!state.reminderEnabled;save();syncAndroidReminder(state.reminderEnabled);if(state.reminderEnabled)toast('Allow notifications when Android asks.');render()};el.querySelector('#showIntroduction').onclick=()=>{state.onboardingComplete=false;save();showView('today');renderToday()};el.querySelector('#sound').onclick=()=>{state.sound=!state.sound;save();render()};el.querySelector('#testSound').onclick=()=>playCue('rest');el.querySelector('#manualAdd').onclick=manualAdd;el.querySelector('#export').onclick=exportData;el.querySelector('#import').onclick=()=>el.querySelector('#importFile').click();el.querySelector('#importFile').onchange=handleImportFile;const reset=el.querySelector('#reset');reset.onclick=()=>{if(reset.dataset.confirm!=='yes'){reset.dataset.confirm='yes';reset.textContent='Tap again to erase everything';toast('Tap Reset again to confirm.');return}localStorage.removeItem(KEY);state=defaults();syncAndroidReminder(false);showView('today');render()}}
function manualAdd(){if(fullRestDue()){toast('Full Rest Day keeps the queue paused.');return}const t=document.querySelector('#manualType').value;if(t==='Active Mobility'){state.history.unshift(snapshot(t,false,{manual:true}));toast('Recovery entry added. Queue unchanged.');render();return}if(state.blockReady&&t.startsWith('Resistance')){toast('Start the next exercise block first.');return}if(t.startsWith('Resistance')){const s=t.slice(-1);if(state.nextType!=='Resistance'||s!==state.res){toast(`${t} is not next. Queue unchanged.`);return}state.history.unshift(snapshot(t,false,{manual:true,session:s}));advanceResistance()}else{if(state.nextType!=='Conditioning'){toast('Conditioning is not next. Queue unchanged.');return}const expected=state.condIntensity?'Intervals':'Zone 2';if(t!==expected&&!t.startsWith('Other')){toast(`${expected} is next. Queue unchanged.`);return}state.history.unshift(snapshot(t,t.startsWith('Other'),{...conditioningSnapshot(t.startsWith('Other')),manual:true}));advanceConditioning();if(state.hift?.status==='parked')state.hift=null}state.gate=null;state.timer=null;state.selectedDuration=null;state.explosiveDraft={};state.supportSelected=false;state.activeSession=null;toast('Planned session restored and queue advanced.');render()}
function downloadState(data,prefix='revolve-backup'){const payload={app:'Revolve',schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),data},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`${prefix}-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){downloadState(state)}
function validateImportedState(payload){const imported=payload?.app==='Revolve'&&payload.data?payload.data:payload;if(!imported||typeof imported!=='object'||Array.isArray(imported))throw new Error('This is not a Revolve backup.');if(imported.schemaVersion&&Number(imported.schemaVersion)>SCHEMA_VERSION)throw new Error('This backup was made by a newer version of Revolve.');if(imported.history!=null&&!Array.isArray(imported.history))throw new Error('The history in this backup is invalid.');if(imported.counts!=null&&typeof imported.counts!=='object')throw new Error('The program progress in this backup is invalid.');return imported}
async function handleImportFile(event){const file=event.target.files?.[0],status=document.querySelector('#importStatus');if(!file)return;try{if(file.size>20*1024*1024)throw new Error('This backup is too large.');const imported=validateImportedState(JSON.parse(await file.text())),sessions=Array.isArray(imported.history)?imported.history.length:0;if(!confirm(`Restore this Revolve backup with ${sessions} history entries? Current data will be replaced after a safety backup is downloaded.`)){event.target.value='';return}downloadState(state,'revolve-before-import');localStorage.setItem(KEY,JSON.stringify(imported));state=load();editHistoryId=null;historyMode='sessions';status.textContent=`Restored ${state.history.length} history entries.`;save();render();toast('Backup restored.')}catch(error){status.textContent=error.message||'Backup could not be restored.';toast('Import failed.')}finally{event.target.value=''}}
function runRecoveryTest(history){const original=state;try{state={...defaults(),history:normalizeHistory(history)};return{guard:recoveryGuardDue(),rest:fullRestDue()}}finally{state=original}}
function runBlockComparisonTest(history,block){const original=state;try{state={...defaults(),block,history:normalizeHistory(history)};return blockComparison(block)}finally{state=original}}
if(new URLSearchParams(location.search).has('test'))import('./tests.js').then(module=>module.runRevolveTests({nudgeChange,suggestedLoad,resetLoad,progressionFromReps,isDeloadSession,timerPosition,conditioningCycle,validateImportedState,runRecoveryTest,runBlockComparisonTest,explosiveEligible,getExplosive,explosivePhase,supportPrescription,isHiftQueueEligible,hiftCooldownStatus,generateHiftWorkout,verticalHypertrophyExercise:exercises.Upper.Vertical.Hypertrophy[0],hiftHasMilitaryPress:hiftDatabase.push.some(x=>x.name==='Kettlebell Military Press')}));
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));window.scrollTo({top:0,behavior:'smooth'});if(b.dataset.view==='history')renderHistory();if(b.dataset.view==='settings')renderSettings()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncTimer(true);playPendingCue();requestWakeLock();render();syncAndroidWidget();syncAndroidReminder(false)}});let observedDay=localDayKey();setInterval(()=>{const today=localDayKey();if(today!==observedDay){observedDay=today;render()}},60000);render();syncAndroidWidget();syncAndroidReminder(false);
</script>
<script>
let deferredInstallPrompt=null;
const installButton=document.querySelector('#installApp');
const connectionStatus=document.querySelector('#connectionStatus');
const installDialog=document.querySelector('#installDialog');
const installInstructions=document.querySelector('#installInstructions');

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function syncInstallButton(){
  if(window.RevolveAndroid){installButton.hidden=true;return}
  if(isStandalone())localStorage.setItem('revolve-pwa-installed','1');
  installButton.hidden=isStandalone()||localStorage.getItem('revolve-pwa-installed')==='1';
}

function updateConnectionStatus(){
  if(window.RevolveAndroid){connectionStatus.textContent='Android app · offline ready';return}
  connectionStatus.textContent=navigator.onLine?'Train the pattern · rotate the stimulus':'Offline · training data stays available';
}

window.addEventListener('online',updateConnectionStatus);
window.addEventListener('offline',updateConnectionStatus);
updateConnectionStatus();

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
});

installButton.addEventListener('click',async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted')localStorage.setItem('revolve-pwa-installed','1');
    deferredInstallPrompt=null;
    syncInstallButton();
    return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  installInstructions.innerHTML=ios
    ?'<p>Safari manages installation on iPhone and iPad:</p><ol><li>Tap <strong>Share</strong> at the bottom.</li><li>Choose <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>'
    :'<p>Use your browser installation option:</p><ol><li>Open the browser menu <strong>⋮</strong>.</li><li>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li><li>Confirm the installation.</li></ol>';
  if(typeof installDialog.showModal==='function')installDialog.showModal();
  else alert(installInstructions.textContent);
});

document.querySelector('#closeInstallDialog').addEventListener('click',()=>installDialog.close());

window.addEventListener('appinstalled',()=>{
  localStorage.setItem('revolve-pwa-installed','1');
  deferredInstallPrompt=null;
  syncInstallButton();
});

window.matchMedia('(display-mode: standalone)').addEventListener?.('change',syncInstallButton);
syncInstallButton();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
}
</script>
